name: Flutter CI

on:
  push:
    branches: [clean]
  pull_request:
    branches: [clean]

jobs:
  flutter:
    name: Analyze, test, and build Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
