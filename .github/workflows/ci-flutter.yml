name: Flutter CI

on:
  push:
    branches: [clean]
  pull_request:
    branches: [clean]

jobs:
  flutter:
    name: Analyze, test, and build Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  firebase-rules:
    name: Firebase Rules emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rules test dependencies
        working-directory: rules-tests
        run: npm ci

      - name: Run Firebase Rules emulator tests
        working-directory: rules-tests
        run: npm run test:emulator
