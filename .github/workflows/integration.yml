name: Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  freshness-integration:
    name: Firebase emulator-backed Flutter integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json

      - name: Install integration harness dependencies
        working-directory: integration-tests
        run: npm ci

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator-backed integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/ci/run_freshness_integration.sh
